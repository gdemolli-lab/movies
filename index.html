<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Inter & JetBrains Mono for authentic Swiss International Typographic Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            paper: '#F8F7F4',
            ink: '#111111',
            muted: '#666666',
            swissRed: '#D92B2B',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F8F7F4;
      color: #111111;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Hairline Swiss Grid Borders */
    .swiss-border {
      border-color: #111111;
    }

    /* Subtle poster fade-in transition */
    #moviePoster {
      transition: opacity 0.25s ease;
    }

    /* Hide broken image icon cleanly */
    img[src=""] {
      opacity: 0;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 md:p-10">

  <!-- SINGLE CENTERED SWISS EDITORIAL SHEET (NO APP TITLE, NO HEADER, JUST BUTTON + MOVIE) -->
  <main class="w-full max-w-[920px] border border-ink bg-paper">

    <!-- TOP ACTION BAR: ONLY THE 'SUGGEST A MOVIE' BUTTON & SUBTLE CSV LOADER -->
    <div class="grid grid-cols-12 border-b border-ink">
      <button id="suggestBtn" type="button"
        class="col-span-10 sm:col-span-11 bg-ink text-paper hover:bg-paper hover:text-ink active:bg-ink/90 transition-colors duration-150 px-5 sm:px-7 py-4 sm:py-5 flex items-center justify-between text-left group cursor-pointer focus:outline-none">
        <span class="flex items-center space-x-3">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-paper group-hover:bg-ink transition-colors"></span>
          <span class="text-xs sm:text-sm font-semibold uppercase tracking-[0.16em]">Suggest a Movie</span>
        </span>
        <span class="font-mono text-[11px] uppercase tracking-widest opacity-70 group-hover:opacity-100">
          [Space] / &rarr;
        </span>
      </button>

      <!-- Discreet CSV File Loader for local 3,699-row NYT file if opened without a server -->
      <label title="Load nyt_movies_loved_since_2000_full.csv"
        class="col-span-2 sm:col-span-1 border-l border-ink bg-paper hover:bg-ink hover:text-paper transition-colors flex flex-col items-center justify-center cursor-pointer select-none p-2 text-center">
        <span id="csvCountLabel" class="font-mono text-[10px] leading-tight font-medium">CSV</span>
        <input id="csvFileInput" type="file" accept=".csv,.txt" class="hidden">
      </label>
    </div>

    <!-- INLINE ERROR NOTICE (HIDDEN UNLESS NEEDED, NO BROWSER ALERTS) -->
    <div id="errorBanner" class="hidden border-b border-ink bg-paper px-5 py-3 text-xs font-mono text-swissRed flex items-center justify-between">
      <span id="errorText"></span>
      <button id="dismissErrorBtn" type="button" class="underline uppercase ml-4">Dismiss</button>
    </div>

    <!-- MOVIE CARD BODY -->
    <article class="grid grid-cols-1 md:grid-cols-12">

      <!-- LEFT COLUMN: MOVIE POSTER (5 COLUMNS) -->
      <div class="md:col-span-5 border-b md:border-b-0 md:border-r border-ink bg-[#EFECE6] relative flex items-center justify-center aspect-[2/3] w-full overflow-hidden">
        <!-- Minimalist Typographic Fallback when Poster is missing or loading -->
        <div id="posterFallback" class="absolute inset-0 flex flex-col justify-between p-6 text-muted select-none pointer-events-none">
          <div class="flex justify-between font-mono text-[10px] uppercase tracking-widest">
            <span id="fallbackImdbId">TT0000000</span>
            <span id="fallbackYear">----</span>
          </div>
          <div class="my-auto">
            <p id="fallbackTitle" class="text-lg font-semibold text-ink tracking-tight uppercase leading-snug"></p>
          </div>
          <div class="font-mono text-[10px] uppercase tracking-widest">
            35MM ARCHIVE FRAME
          </div>
        </div>

        <!-- Live OMDb Poster Image -->
        <img id="moviePoster" src="" alt="Film Poster"
          class="relative z-10 w-full h-full object-cover opacity-0"
          onload="if(this.src && !this.src.endsWith(window.location.href)) { this.classList.remove('opacity-0'); }"
          onerror="this.classList.add('opacity-0');">
      </div>

      <!-- RIGHT COLUMN: SWISS TYPOGRAPHIC SPECIFICATION & PLOT (7 COLUMNS) -->
      <div class="md:col-span-7 flex flex-col justify-between">

        <!-- TOP METADATA ROW -->
        <div class="border-b border-ink px-5 sm:px-7 py-3.5 flex flex-wrap items-center justify-between gap-2 font-mono text-[11px] uppercase tracking-wider text-muted">
          <div class="flex items-center space-x-2 sm:space-x-3">
            <span id="movieIndex" class="text-ink font-medium">#----</span>
            <span>/</span>
            <span id="movieYear" class="text-ink font-medium">----</span>
            <span>/</span>
            <span id="movieRuntime">-- MIN</span>
            <span id="movieRatedWrapper" class="hidden sm:inline">
              <span>/</span>
              <span id="movieRated" class="ml-2">NR</span>
            </span>
          </div>

          <!-- Curated NYT / Awards Badges from CSV -->
          <div id="accoladeBadges" class="flex items-center flex-wrap gap-1.5"></div>
        </div>

        <!-- MAIN FILM TITLE & BRIEF IMDB DESCRIPTION -->
        <div class="px-5 sm:px-7 py-6 sm:py-8 flex-grow flex flex-col justify-center">
          <h1 id="movieTitle"
            class="text-2xl sm:text-4xl font-bold tracking-[-0.03em] leading-[1.06] text-ink mb-5">
            Loading Selection...
          </h1>

          <p id="moviePlot"
            class="text-sm sm:text-[15px] leading-[1.68] text-ink/90 font-normal max-w-[58ch]">
            Retrieving film details from IMDb...
          </p>
        </div>

        <!-- STRUCTURED SWISS SPECIFICATION TABLE -->
        <div class="border-t border-ink divide-y divide-ink text-xs">

          <!-- Director -->
          <div class="grid grid-cols-12 px-5 sm:px-7 py-2.5 items-baseline">
            <span class="col-span-4 sm:col-span-3 font-mono text-[10px] uppercase tracking-widest text-muted">Director</span>
            <span id="movieDirector" class="col-span-8 sm:col-span-9 font-medium text-ink truncate">-</span>
          </div>

          <!-- Cast -->
          <div class="grid grid-cols-12 px-5 sm:px-7 py-2.5 items-baseline">
            <span class="col-span-4 sm:col-span-3 font-mono text-[10px] uppercase tracking-widest text-muted">Cast</span>
            <span id="movieActors" class="col-span-8 sm:col-span-9 font-normal text-ink truncate">-</span>
          </div>

          <!-- Genre -->
          <div class="grid grid-cols-12 px-5 sm:px-7 py-2.5 items-baseline">
            <span class="col-span-4 sm:col-span-3 font-mono text-[10px] uppercase tracking-widest text-muted">Genre</span>
            <span id="movieGenre" class="col-span-8 sm:col-span-9 font-normal text-ink truncate">-</span>
          </div>

          <!-- IMDb Rating & Metascore / Review Date -->
          <div class="grid grid-cols-12 divide-x divide-ink">
            <div class="col-span-6 px-5 sm:px-7 py-2.5 flex items-baseline justify-between">
              <span class="font-mono text-[10px] uppercase tracking-widest text-muted">IMDb</span>
              <span id="movieRating" class="font-mono text-xs font-medium text-ink">- / 10</span>
            </div>
            <div class="col-span-6 px-5 sm:px-7 py-2.5 flex items-baseline justify-between">
              <span class="font-mono text-[10px] uppercase tracking-widest text-muted">Country</span>
              <span id="movieCountry" class="font-mono text-[11px] text-ink truncate max-w-[140px]">-</span>
            </div>
          </div>

        </div>

        <!-- BOTTOM EXTERNAL LINKS ROW (FROM CSV & IMDB) -->
        <div class="grid grid-cols-2 sm:grid-cols-4 border-t border-ink divide-y sm:divide-y-0 sm:divide-x divide-ink font-mono text-[11px] uppercase tracking-wider">
          <a id="imdbLink" href="https://www.imdb.com" target="_blank" rel="noopener noreferrer"
            class="px-4 py-3 flex items-center justify-between hover:bg-ink hover:text-paper transition-colors">
            <span>IMDb</span>
            <span>&nearr;</span>
          </a>
          <a id="nytLink" href="https://www.nytimes.com" target="_blank" rel="noopener noreferrer"
            class="px-4 py-3 flex items-center justify-between hover:bg-ink hover:text-paper transition-colors border-l sm:border-l-0 border-ink">
            <span>NYT Review</span>
            <span>&nearr;</span>
          </a>
          <a id="letterboxdLink" href="https://letterboxd.com" target="_blank" rel="noopener noreferrer"
            class="px-4 py-3 flex items-center justify-between hover:bg-ink hover:text-paper transition-colors">
            <span>Letterboxd</span>
            <span>&nearr;</span>
          </a>
          <a id="justwatchLink" href="https://www.justwatch.com" target="_blank" rel="noopener noreferrer"
            class="px-4 py-3 flex items-center justify-between hover:bg-ink hover:text-paper transition-colors border-l sm:border-l-0 border-ink">
            <span>JustWatch</span>
            <span>&nearr;</span>
          </a>
        </div>

      </div>

    </article>

  </main>

    // RFC-4180 compliant single-line CSV parser to handle quoted genres and titles with commas
    function splitCsvRow(line) {
      const cells = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          cells.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      cells.push(current.trim());
      return cells;
    }

    // Parse full NYT CSV or simple 2-column CSV
    function parseMovieCsv(rawText) {
      const lines = rawText.split(/\r?\n/).filter(l => l.trim().length > 0);
      if (lines.length < 2) return [];

      const headers = splitCsvRow(lines[0]).map(h => h.toLowerCase());
      const idx = {
        id: headers.indexOf('id'),
        title: headers.indexOf('title'),
        year: headers.indexOf('year'),
        genres: headers.indexOf('genres'),
        best_of_year: headers.indexOf('best_of_year'),
        oscar_winner: headers.indexOf('oscar_winner'),
        nyt_top100_rank: headers.indexOf('nyt_top100_rank'),
        imdb_id: headers.indexOf('imdb_id'),
        nyt_url: headers.indexOf('nyt_url'),
        imdb_url: headers.indexOf('imdb_url'),
        letterboxd_url: headers.indexOf('letterboxd_url'),
        justwatch_url: headers.indexOf('justwatch_url'),
      };

      const parsed = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = splitCsvRow(lines[i]);
        const rowText = lines[i];
        const ttMatch = (idx.imdb_id !== -1 && cols[idx.imdb_id])
          ? cols[idx.imdb_id].match(/tt\d+/)
          : rowText.match(/tt\d+/);

        if (!ttMatch) continue;
        const imdbId = ttMatch[0];
        const title = (idx.title !== -1 && cols[idx.title]) ? cols[idx.title] : 'Untitled';

        parsed.push({
          id: (idx.id !== -1 && cols[idx.id]) ? cols[idx.id] : String(i),
          title,
          year: (idx.year !== -1 && cols[idx.year]) ? cols[idx.year] : '',
          genres: (idx.genres !== -1 && cols[idx.genres]) ? cols[idx.genres] : '',
          best_of_year: idx.best_of_year !== -1 && cols[idx.best_of_year] === 'True',
          oscar_winner: idx.oscar_winner !== -1 && cols[idx.oscar_winner] === 'True',
          nyt_top100_rank: (idx.nyt_top100_rank !== -1 && cols[idx.nyt_top100_rank]) ? parseInt(cols[idx.nyt_top100_rank], 10) : null,
          imdb_id: imdbId,
          nyt_url: (idx.nyt_url !== -1 && cols[idx.nyt_url]) ? cols[idx.nyt_url] : `https://www.nytimes.com/search?query=${encodeURIComponent(title)}`,
          imdb_url: (idx.imdb_url !== -1 && cols[idx.imdb_url]) ? cols[idx.imdb_url] : `https://www.imdb.com/title/${imdbId}/`,
          letterboxd_url: (idx.letterboxd_url !== -1 && cols[idx.letterboxd_url]) ? cols[idx.letterboxd_url] : `https://letterboxd.com/imdb/${imdbId}/`,
          justwatch_url: (idx.justwatch_url !== -1 && cols[idx.justwatch_url]) ? cols[idx.justwatch_url] : `https://www.justwatch.com/us/search?q=${encodeURIComponent(title)}`
        });
      }
      return parsed;
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorBanner.classList.remove('hidden');
    }

    function hideError() {
      errorBanner.classList.add('hidden');
    }

    // Render NYT / Oscar badges cleanly in Swiss style
    function renderBadges(film) {
      accoladeBadges.innerHTML = '';
      if (film.nyt_top100_rank) {
        const badge = document.createElement('span');
        badge.className = 'border border-ink bg-ink text-paper px-1.5 py-0.5 text-[10px] font-mono';
        badge.textContent = `NYT TOP #${film.nyt_top100_rank}`;
        accoladeBadges.appendChild(badge);
      }
      if (film.oscar_winner) {
        const badge = document.createElement('span');
        badge.className = 'border border-ink px-1.5 py-0.5 text-[10px] font-mono text-ink';
        badge.textContent = 'OSCAR WINNER';
        accoladeBadges.appendChild(badge);
      } else if (film.best_of_year) {
        const badge = document.createElement('span');
        badge.className = 'border border-ink px-1.5 py-0.5 text-[10px] font-mono text-ink';
        badge.textContent = 'CRITICS PICK';
        accoladeBadges.appendChild(badge);
      }
    }

    // Pick a random movie from the dataset and query OMDb for live IMDb plot & details
    async function suggestRandomMovie() {
      if (movies.length === 0) return;
      hideError();

      let pool = movies;
      if (movies.length > 1 && lastImdbId) {
        pool = movies.filter(m => m.imdb_id !== lastImdbId);
      }
      const film = pool[Math.floor(Math.random() * pool.length)];
      lastImdbId = film.imdb_id;

      // Immediate optimistic update from CSV row
      statusDot.classList.replace('bg-paper', 'bg-swissRed');
      moviePoster.classList.add('opacity-0');
      fallbackImdbId.textContent = film.imdb_id.toUpperCase();
      fallbackYear.textContent = film.year || '----';
      fallbackTitle.textContent = film.title;

      movieIndex.textContent = `#${String(film.id).padStart(4, '0')}`;
      movieYear.textContent = film.year || '----';
      movieRuntime.textContent = '-- MIN';
      movieTitle.textContent = film.title;
      moviePlot.textContent = 'Loading brief IMDb description...';
      movieGenre.textContent = film.genres || '-';
      movieDirector.textContent = '-';
      movieActors.textContent = '-';
      movieRating.textContent = '- / 10';
      movieCountry.textContent = '-';

      renderBadges(film);

      imdbLink.href = film.imdb_url;
      nytLink.href = film.nyt_url;
      letterboxdLink.href = film.letterboxd_url;
      justwatchLink.href = film.justwatch_url;

      try {
        const res = await fetch(`https://www.omdbapi.com/?i=${film.imdb_id}&plot=short&apikey=${OMDB_API_KEY}`);
        const data = await res.json();
        statusDot.classList.replace('bg-swissRed', 'bg-paper');

        if (data.Response === 'True') {
          movieTitle.textContent = data.Title || film.title;
          movieYear.textContent = data.Year || film.year || '----';
          movieRuntime.textContent = (data.Runtime && data.Runtime !== 'N/A') ? data.Runtime.toUpperCase() : '-- MIN';

          if (data.Rated && data.Rated !== 'N/A') {
            movieRated.textContent = data.Rated;
            movieRatedWrapper.classList.remove('hidden');
          } else {
            movieRatedWrapper.classList.add('hidden');
          }

          moviePlot.textContent = (data.Plot && data.Plot !== 'N/A')
            ? data.Plot
            : 'No plot description available on IMDb for this selection.';

          movieDirector.textContent = (data.Director && data.Director !== 'N/A') ? data.Director : '-';
          movieActors.textContent = (data.Actors && data.Actors !== 'N/A') ? data.Actors : '-';
          movieGenre.textContent = (data.Genre && data.Genre !== 'N/A') ? data.Genre : (film.genres || '-');
          movieRating.textContent = (data.imdbRating && data.imdbRating !== 'N/A') ? `${data.imdbRating} / 10` : '- / 10';
          movieCountry.textContent = (data.Country && data.Country !== 'N/A') ? data.Country : '-';

          if (data.Poster && data.Poster !== 'N/A') {
            moviePoster.src = data.Poster;
            moviePoster.alt = `${data.Title} Poster`;
          } else {
            moviePoster.removeAttribute('src');
          }
        } else {
          moviePlot.textContent = 'IMDb description unavailable for this catalog entry.';
        }
      } catch (err) {
        statusDot.classList.replace('bg-swissRed', 'bg-paper');
        showError('Could not reach OMDb API. Displaying CSV metadata.');
      }
    }

    // Load embedded dataset immediately, then attempt to load full nyt_movies_loved_since_2000_full.csv
    async function init() {
      movies = parseMovieCsv(EMBEDDED_NYT_CSV);
      csvCountLabel.textContent = `${movies.length}`;

      // Immediately load a random movie on initial startup
      suggestRandomMovie();

      // Try fetching the full 3,699-row NYT CSV file if hosted alongside index.html
      const csvFilesToTry = ['nyt_movies_loved_since_2000_full.csv', 'movies.csv'];
      for (const fileName of csvFilesToTry) {
        try {
          const response = await fetch(fileName, { cache: 'no-store' });
          if (response.ok) {
            const text = await response.text();
            const fullList = parseMovieCsv(text);
            if (fullList.length > 0) {
              movies = fullList;
              csvCountLabel.textContent = `${movies.length}`;
              // Refresh with a selection from the full 3,699-movie table
              suggestRandomMovie();
              break;
            }
          }
        } catch (_) {
          // Keep using embedded NYT list if running without a local HTTP server
        }
      }
    }

    // Button click & Spacebar shortcut to suggest another random movie
    suggestBtn.addEventListener('click', suggestRandomMovie);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        suggestRandomMovie();
      }
    });

    // Optional manual CSV file drop/select for local file testing
    csvFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const parsed = parseMovieCsv(ev.target.result);
        if (parsed.length > 0) {
          movies = parsed;
          csvCountLabel.textContent = `${movies.length}`;
          suggestRandomMovie();
        } else {
          showError('No valid IMDb IDs found in selected CSV file.');
        }
      };
      reader.readAsText(file);
    });

    dismissErrorBtn.addEventListener('click', hideError);

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
